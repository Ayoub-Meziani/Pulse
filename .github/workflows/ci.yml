name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test database (throwaway Postgres + supabase/migrations)
        run: python ../scripts/test_db.py up
      - name: Tests
        env:
          PULSE_TEST_DATABASE_URL: postgresql+psycopg://postgres:pulse-test-only@127.0.0.1:55432/postgres
          PULSE_REQUIRE_DB: "1"
        run: pytest -q
      - name: Contract is up to date
        run: |
          python -m app.export_openapi
          git diff --exit-code -- ../contract/openapi.json || (echo "contract/openapi.json is stale: run 'python -m app.export_openapi' from api/ and commit it" && exit 1)
