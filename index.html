<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clickable demo of PULSE: hypertension monitoring, early warning and emergency support (hackathon prototype, fictional data).">
<title>PULSE Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
body { margin: 0 }
[hidden] { display: none !important }
/* Layout: night-blue clinical shell; one browser frame holding the real app screen with live hotspots, flow steps beside it */
:root {
  --night: #050b1a; --navy: #0f2744; --panel: #0d1d36; --line: #1f3a60;
  --ink: #eef3fa; --muted: #a9bcd3; --glow: #38bdf8; --alarm: #e5484d;
  --display: 'Manrope', 'Segoe UI', Arial, sans-serif;
  --body: 'Inter', 'Segoe UI', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { background: radial-gradient(ellipse at 85% 0%, #14305a 0%, var(--night) 55%) fixed, var(--night); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(140deg, #2563eb, #38bdf8); display: grid; place-items: center; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .14em; margin: 0; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.notice { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
.flows { display: flex; gap: 8px; flex-wrap: wrap; }
.flows button { font: 600 14px var(--body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.flows button[aria-pressed="true"] { color: var(--night); background: var(--glow); border-color: var(--glow); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
.frame { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); box-shadow: 0 30px 80px -30px rgba(0,0,0,.7); }
.chrome { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #2a4670; }
.url { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); background: var(--night); border-radius: 6px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.screen { position: relative; aspect-ratio: 1536 / 730; max-width: 100%; background: var(--night); }
.screen img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .25s ease; }
.hot { position: absolute; border: 2px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; padding: 0; }
.hot:hover, .hot:focus-visible { border-color: var(--glow); background: rgba(56,189,248,.14); outline: none; }
.show .hot { border-color: var(--glow); background: rgba(56,189,248,.12); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(56,189,248,.18) } }
@media (prefers-reduced-motion: reduce) { .show .hot { animation: none } .screen img { transition: none } }
aside { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--glow); margin: 0; }
.card h2 { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.2; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); }
.tip { font-size: 13px; color: var(--ink); background: rgba(56,189,248,.08); border: 1px dashed rgba(56,189,248,.4); border-radius: 10px; padding: 9px 12px; }
.nav { display: flex; gap: 8px; }
.nav button, .toggle { font: 600 14px var(--body); border-radius: 10px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--navy); color: var(--ink); }
.nav button:disabled { opacity: .4; cursor: default; }
.nav .next { flex: 1; background: var(--glow); color: var(--night); border-color: var(--glow); }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
ol button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: baseline; font: 500 14px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 7px 8px; cursor: pointer; }
ol button span { font-variant-numeric: tabular-nums; color: #5f7a9c; width: 1.4em; flex: none; }
ol button[aria-current="step"] { background: var(--navy); color: var(--ink); }
ol button[aria-current="step"] span { color: var(--glow); }
.sep { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #5f7a9c; padding: 8px 8px 2px; }
footer { color: #6d86a6; font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
footer a { color: var(--muted); }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr) } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></div>
      <div><h1>PULSE</h1><p>Hypertension monitoring, early warning and emergency support</p></div>
    </div>
    <div class="flows" role="group" aria-label="Choose a journey">
      <button type="button" id="flow-patient" data-flow="patient">Patient journey</button>
      <button type="button" id="flow-doctor" data-flow="doctor">Doctor journey</button>
    </div>
  </header>

  <div class="stage">
    <div class="frame">
      <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url" id="url">localhost/login</span></div>
      <div class="screen" id="screen"><img id="shot" alt=""></div>
    </div>
    <aside>
      <div class="card" aria-live="polite">
        <p class="eyebrow" id="eyebrow">Step 1 of 8</p>
        <h2 id="heading"></h2>
        <p id="caption"></p>
        <p class="tip" id="tip"></p>
        <div class="nav">
          <button type="button" id="prev">Back</button>
          <button type="button" class="next" id="next">Next screen</button>
        </div>
        <button type="button" class="toggle" id="toggle" aria-pressed="false">Show clickable areas</button>
      </div>
      <div class="card"><ol id="steps"></ol></div>
    </aside>
  </div>

  <footer>
    <span>Real screenshots of the running app · French interface · fictional demo accounts</span>
    <span>Prototype, not a medical device</span>
    <a href="https://github.com/Ayoub-Meziani/Pulse" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>
</div>

<script>
const S = 1536, H = 730;
const box = (x1, y1, x2, y2, to, label) => ({ x1, y1, x2, y2, to, label });
const screens = [
  { id: 'login', flow: 'patient', url: 'pulse/login', title: 'Sign in',
    caption: 'Access is limited to registered patients and their doctors; public sign-up is closed.',
    tip: 'Click “Se connecter” to sign in as Nadia, a patient.',
    hot: [box(1011, 457, 1329, 501, 'dashboard', 'Sign in')] },
  { id: 'dashboard', flow: 'patient', url: 'pulse/patient', title: 'Patient dashboard',
    caption: 'Latest reading, 7-day average and trend, the target set by her doctor, open alerts. The red Emergency button is on every page.',
    tip: 'Click “Nouvelle mesure” to enter a reading, or “Urgence” for the emergency screen.',
    hot: [box(454, 254, 590, 288, 'reading', 'New reading'), box(16, 105, 188, 138, 'reading', 'New reading'), box(16, 611, 188, 645, 'emergency', 'Emergency')] },
  { id: 'reading', flow: 'patient', url: 'pulse/patient/mesure', title: 'New reading',
    caption: 'Two numbers, optional pulse, position and “rested 5 minutes”. The database checks every value; impossible readings are refused.',
    tip: 'Nadia enters 186/118. Click “Enregistrer la mesure” to save it.',
    hot: [box(621, 614, 773, 648, 'alarm', 'Save reading')] },
  { id: 'alarm', flow: 'patient', url: 'pulse/patient/mesure', title: 'Severe reading: alarm',
    caption: 'At 180/120 or above, a full-screen alarm rings about one second after saving, with the medical card, a symptom check and a re-check in 60 s. The sound stops only when the patient confirms with their password.',
    tip: 'Click the call button to open the emergency screen.',
    hot: [box(325, 643, 863, 713, 'emergency', 'Call button')] },
  { id: 'emergency', flow: 'patient', url: 'pulse/patient/urgence', title: 'Emergency screen',
    caption: 'Call first, then warn a trusted contact and optionally share a position. PULSE records “call button tapped”, never “call made”. Demo mode dials a team member, never a real emergency number.',
    tip: 'Click the sign-out icon (bottom left) to switch to the doctor.',
    hot: [box(16, 66, 188, 100, 'dashboard', 'Dashboard'), box(158, 683, 184, 709, 'doctor-alarm', 'Sign out')] },
  { id: 'doctor-alarm', flow: 'doctor', url: 'pulse/doctor', title: 'Doctor: severe alert',
    caption: 'The same kind of alert reaches the doctor and stays on every page of the doctor app until the doctor closes it.',
    tip: 'Click “Réduire” to shrink it to a banner.',
    hot: [box(1106, 26, 1195, 61, 'doctor-patients', 'Minimise'), box(982, 27, 1082, 61, 'doctor-patients', 'Mute')] },
  { id: 'doctor-patients', flow: 'doctor', url: 'pulse/doctor', title: 'Patients by urgency',
    caption: 'Assigned patients only, most urgent first. Nadia’s 186/118 alert shows that she confirmed it and is waiting for the doctor.',
    tip: 'Click Karim’s card or “Ouvrir le dossier” to open a record.',
    hot: [box(446, 352, 718, 386, 'doctor-record', 'Open record'), box(428, 685, 709, 730, 'doctor-record', 'Karim')] },
  { id: 'doctor-record', flow: 'doctor', url: 'pulse/doctor/patients/karim', title: 'Patient record',
    caption: 'Averages, share of readings above target, trend chart against the target; simulated values are drawn hollow. Tabs cover readings, alerts, incidents, journal, ring data, weekly report, the doctor-only AI estimate, notes and care plan.',
    tip: 'Click “Mes patients” to go back to the list.',
    hot: [box(431, 66, 516, 84, 'doctor-patients', 'Back to patients'), box(16, 66, 188, 100, 'doctor-patients', 'My patients')] }
];
const byId = Object.fromEntries(screens.map((s, i) => [s.id, i]));
const $ = id => document.getElementById(id);
let cur = 0;

// preload so screen changes feel instant
screens.forEach(s => { const i = new Image(); i.src = `screens/${fileOf(s.id)}`; });
function fileOf(id) { return { login: 'login.jpg', dashboard: 'patient-dashboard.jpg', reading: 'new-reading.jpg', alarm: 'alarm.jpg', emergency: 'emergency.jpg', 'doctor-alarm': 'doctor-alarm.jpg', 'doctor-patients': 'doctor-patients.jpg', 'doctor-record': 'doctor-record.jpg' }[id]; }

function buildSteps() {
  const ol = $('steps'); let last = '';
  screens.forEach((s, i) => {
    if (s.flow !== last) { const li = document.createElement('li'); li.className = 'sep'; li.textContent = s.flow === 'patient' ? 'Patient · Nadia' : 'Doctor · Dr Mansouri'; ol.append(li); last = s.flow; }
    const li = document.createElement('li'); const b = document.createElement('button');
    b.type = 'button'; b.id = 'step-' + s.id; b.innerHTML = `<span>${i + 1}</span>${s.title}`;
    b.onclick = () => go(i); li.append(b); ol.append(li);
  });
}

function go(i, fromHash) {
  cur = Math.max(0, Math.min(screens.length - 1, i));
  const s = screens[cur];
  $('shot').src = `screens/${fileOf(s.id)}`;
  $('shot').alt = `PULSE app screen: ${s.title}`;
  $('url').textContent = s.url;
  $('eyebrow').textContent = `Step ${cur + 1} of ${screens.length} · ${s.flow === 'patient' ? 'Patient' : 'Doctor'}`;
  $('heading').textContent = s.title;
  $('caption').textContent = s.caption;
  $('tip').textContent = s.tip;
  $('prev').disabled = cur === 0;
  $('next').textContent = cur === screens.length - 1 ? 'Start again' : 'Next screen';
  document.querySelectorAll('.hot').forEach(h => h.remove());
  s.hot.forEach(h => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'hot'; b.setAttribute('aria-label', h.label);
    Object.assign(b.style, { left: h.x1 / S * 100 + '%', top: h.y1 / H * 100 + '%', width: (h.x2 - h.x1) / S * 100 + '%', height: (h.y2 - h.y1) / H * 100 + '%' });
    b.onclick = () => go(byId[h.to]);
    $('screen').append(b);
  });
  document.querySelectorAll('#steps button').forEach(b => b.toggleAttribute('aria-current', false));
  $('step-' + s.id).setAttribute('aria-current', 'step');
  $('flow-patient').setAttribute('aria-pressed', s.flow === 'patient');
  $('flow-doctor').setAttribute('aria-pressed', s.flow === 'doctor');
  if (!fromHash && location.hash !== '#' + s.id) history.replaceState(null, '', '#' + s.id);
}

$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur === screens.length - 1 ? 0 : cur + 1);
$('flow-patient').onclick = () => go(byId.login);
$('flow-doctor').onclick = () => go(byId['doctor-alarm']);
$('toggle').onclick = e => { const on = $('screen').classList.toggle('show'); e.currentTarget.setAttribute('aria-pressed', on); e.currentTarget.textContent = on ? 'Hide clickable areas' : 'Show clickable areas'; };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1); });
window.addEventListener('hashchange', () => { const i = byId[location.hash.slice(1)]; if (i !== undefined) go(i, true); });

buildSteps();
go(byId[location.hash.slice(1)] ?? 0, true);
// show hotspots briefly on first load so viewers see the screen is clickable
$('screen').classList.add('show'); setTimeout(() => { if ($('toggle').getAttribute('aria-pressed') !== 'true') $('screen').classList.remove('show'); }, 2600);
</script>
</body>
</html>
